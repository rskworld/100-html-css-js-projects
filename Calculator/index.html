<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - rskworld.in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" media="screen" href="https://fontlibrary.org/face/segment7" type="text/css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="calculator-container">
    <div id="myDIV">
      <div class="Screen">
        <div id="History"></div>
        <div id="Output">0</div>
      </div>
      
      <div id="MRC" class="SmallButton">MRC</div>
      <div id="mMinus" class="SmallButton">M-</div>
      <div id="mPlus" class="SmallButton">M+</div>
      <div id="sqrt" class="SmallButton">&#8730;</div>
      <div id="plusMinus" class="SmallButton">&plusmn;</div>
      
      <div id="AC" class="ButtonRed">AC</div>
      <div id="CE" class="ButtonRed">CE</div>
      <div id="%" class="Button">%</div>
      <div id="divide" class="Button">&divide;</div>
      
      <div id="7" class="Button">7</div>
      <div id="8" class="Button">8</div>
      <div id="9" class="Button">9</div>
      <div id="x" class="Button">x</div>
      
      <div id="4" class="Button">4</div>
      <div id="5" class="Button">5</div>
      <div id="6" class="Button">6</div>
      <div id="minus" class="Button">-</div>
      
      <div id="1" class="Button">1</div>
      <div id="2" class="Button">2</div>
      <div id="3" class="Button">3</div>
      <div id="plus" class="ButtonLarge">+</div>
      
      <div id="0" class="Button">0</div>
      <div id="decimal" class="Button">.</div>
      <div id="equals" class="Button">=</div>
      
      <div class="links-container">
        <a href="https://rskworld.in" target="_blank" class="link-more">More</a>
        <a href="http://www.youtube.com/@rskworldin?sub_confirmation=1" target="_blank" class="link-yt" aria-label="YouTube Channel">
          <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24">

          </svg>
        </a>
      </div>
    </div>
  </div>
  <script src="script.js"></script>

</html>
